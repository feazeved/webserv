server {
	listen 8082;
	host 127.0.0.1;
	client_max_body_size 10M;
	root /home/alex/Projects/webserv/www/siege_uploads;
	error_page 400 errors/400.html;
	error_page 403 errors/403.html;
	error_page 404 errors/404.html;
	error_page 405 errors/405.html;
	error_page 413 errors/413.html;
	error_page 500 errors/500.html;

	location / {
		allowed_methods GET;
		index index.html;
		autoindex on;
	}

	location /uploads/ {
		root /home/alex/Projects/webserv/www/siege_uploads/uploads;
