server {
	listen 8084;
	host 127.0.0.1;
	client_max_body_size 10M;
	root /home/alex/Projects/webserv/www/siege_routes;
	error_page 400 errors/400.html;
	error_page 403 errors/403.html;
	error_page 404 errors/404.html;
	error_page 405 errors/405.html;
	error_page 413 errors/413.html;
	error_page 500 errors/500.html;

	location / {
		allowed_methods GET;
		index index.html;
		autoindex on;
	}

	location /alias/ {
		root /home/alex/Projects/webserv/www/siege_routes/mapped;
		allowed_methods GET;
		index index.html;
		autoindex on;
	}

	location /alias/deep/ {
		root /home/alex/Projects/webserv/www/siege_routes/deep_mapping;
		allowed_methods GET;
		index index.html;
		autoindex on;
	}

	location /landing/ {
		root /home/alex/Projects/webserv/www/siege_routes/landing;
		allowed_methods GET;
		index home.htm;
		autoindex on;
	}

	location /no-list/ {
		root /home/alex/Projects/webserv/www/siege_routes/no-list;
		allowed_methods GET;
		index index.html;
		autoindex off;
	}

	location /old {
		allowed_methods GET;
		return 301 /new/;
	}

	location /temporary {
		allowed_methods GET;
		return 302 /new/;
	}

	location /jump {
		allowed_methods GET;
		return 307 /new/;
	}

	location /permanent {
		allowed_methods GET;
		return 308 /new/;
	}
}

