server {
	listen 8080;
	host 127.0.0.1;
	client_max_body_size 10M;
	root /home/alex/Projects/webserv/www/siege;

	location / {
		allowed_methods GET;
		index index.html;
		autoindex on;
	}

	location /uploads/ {
		root /home/alex/Projects/webserv/www/siege/uploads;
		upload_store /home/alex/Projects/webserv/www/siege/uploads;
		allowed_methods GET POST DELETE;
		autoindex on;
	}

	location /cgi/ {
		root /home/alex/Projects/webserv/www/siege/cgi;
		allowed_methods GET POST;

		cgi {
			.py = /usr/bin/python3;
		}
	}
}
